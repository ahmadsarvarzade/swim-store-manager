<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1728">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مدیریت فروشگاه">
  <meta name="description" content="مدیریت فروشگاه شنا با همگام‌سازی ابری و امکان کار آفلاین">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>مدیریت فروشگاه</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark"><span>SM</span></div>
        <div><strong id="brandName">مدیریت فروشگاه</strong><small>مدیریت هوشمند کسب‌وکار</small></div>
      </div>
      <div class="side-label">فضای کاری</div>
      <nav class="main-nav" aria-label="منوی اصلی">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">▦</span><span>داشبورد</span></button>
        <button class="nav-item" data-view="products"><span class="nav-icon">▤</span><span>کالاها و انبار</span><span class="nav-count" id="lowStockCount">0</span></button>
        <button class="nav-item" data-view="purchases"><span class="nav-icon">↙</span><span>خرید و تأمین کالا</span></button>
        <button class="nav-item" data-view="orders"><span class="nav-icon">▣</span><span>سفارش‌ها و فروش</span></button>
        <button class="nav-item" data-view="customers"><span class="nav-icon">♙</span><span>مشتریان</span></button>
        <button class="nav-item" data-view="expenses"><span class="nav-icon">↗</span><span>هزینه‌ها</span></button>
        <button class="nav-item" data-view="ledger"><span class="nav-icon">▥</span><span>صندوق و گردش مالی</span></button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▧</span><span>گزارش‌ها</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="offline-card"><span class="online-dot"></span><div><strong>ذخیره‌سازی محلی فعال</strong><small>همگام‌سازی پس از اتصال</small></div></div>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>تنظیمات و پشتیبان</span></button>
        <div class="sidebar-foot">نسخه ۱.۱ · Cloud + Offline</div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-right">
          <button class="mobile-menu" id="mobileMenu" aria-label="باز کردن منو">☰</button>
          <div><div class="eyebrow" id="todayLabel">امروز</div><div class="page-title" id="pageTitle">داشبورد</div></div>
        </div>
        <div class="topbar-actions">
          <span class="local-badge"><span class="online-dot"></span> در حال بررسی اتصال</span>
          <button class="icon-button" id="quickBackup" title="دریافت نسخه پشتیبان" aria-label="دریافت نسخه پشتیبان">⇩</button>
          <div class="avatar">ف</div>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <!-- Firebase compat SDK: keep these scripts in this order. -->
  <script defer src="https://www.gstatic.com/firebasejs/13.4.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/13.4.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/13.4.0/firebase-database-compat.js"></script>
  <script defer src="./firebase-sync.js"></script>
  <script defer src="./app.js"></script>
  <script defer src="./firebase-integration.js"></script>

  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((error) => {
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>
